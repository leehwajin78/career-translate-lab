<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>일정표 — 한끗프로젝트 PlayBoard</title>
<link rel="stylesheet" href="assets/playboard.css">
</head>
<body>
<div id="shell"></div>
<main id="main"></main>
<script src="data/registry.js"></script>
<script src="assets/playboard.js"></script>
<script>
(function () {
  var PB = window.PB, U = window.PBUI;
  U.shell({ section: 'schedule', crumbs: [{ label: '일정표' }] });

  function clean(t) { return t.replace(/[:,#"<>]/g, ' ').trim(); }
  var waves = PB.computeWaves();

  // ── Gantt 소스 (Wave에서 파생) ───────────────────────────────────────
  var g = ['gantt', '  dateFormat YYYY-MM-DD', '  axisFormat %m/%d', '  todayMarker off'];
  waves.forEach(function (wv) {
    g.push('  section Wave ' + wv.index);
    wv.items.forEach(function (w) {
      var tag = wv.index === 1 ? 'active,' : '';
      g.push('  ' + clean(w.id + ' ' + w.title) + ' :' + tag + ' ' + w.id + ', ' + wv.startDate + ', 1d');
    });
  });
  var ganttCode = g.join('\n');

  var intro = '<div class="tile"><div class="inner"><span class="eyebrow">일정표</span>'
    + '<h2>병렬 구현 일정표</h2>'
    + '<p class="lead">DAG에서 파생한 <strong>Wave(동시 착수 가능 묶음)</strong>입니다. 같은 Wave의 작업은 서로 의존하지 않아 병렬 착수 가능하며, Wave N은 N−1까지 완료되면 시작합니다. Day1 기준일 <span class="mono">' + PB.meta.anchor + '</span> 가정(1 wave ≈ 1 Day)으로 시작일을 추정합니다. 실제 캘린더는 별도 문서가 SoT입니다. <a href="plan.html">의존성 DAG →</a></p></div></div>';

  var ganttTile = '<div class="tile"><div class="inner"><h2>Gantt<span class="sub">막대 색 = 상태 · section = Wave</span></h2><div id="gantt" class="mt2"></div></div></div>';

  // ── Wave별 착수 계획 카드 ────────────────────────────────────────────
  function waveSection(wv) {
    var cards = wv.items.map(function (w) {
      var blocking = PB.blockingDeps(w);
      var depHtml = blocking.length
        ? '<div class="dep block">선행 대기: ' + blocking.join(', ') + '</div>'
        : '<div class="dep free">차단 선행 없음 — 즉시 착수 가능</div>';
      var screensHtml = (w.screens || []).map(function (key) {
        var p = key.split('/'); var sc = PB.getScreen(p[0], p[1]);
        return sc ? '<a class="chip" href="spec.html?plane=' + sc.plane + '&slug=' + sc.slug + '">' + U.esc(sc.id) + '</a>' : '';
      }).join(' ');
      var ext = w.externalRefs ? ' <span class="note mono">' + U.esc(w.externalRefs) + '</span>' : '';
      return '<div class="panel wcard"><div class="row-between"><strong class="mono">' + U.esc(w.id) + '</strong>' + ext + U.statusBadge(w.status) + '</div>'
        + '<div style="font-weight:500;margin:.3rem 0">' + U.esc(w.title) + '</div>'
        + depHtml
        + (screensHtml ? '<div class="statline mt1">' + screensHtml + '</div>' : '') + '</div>';
    }).join('');
    return '<div class="wave-h"><span class="wn">Wave ' + wv.index + '</span>'
      + '<span class="chip">착수 가능 ' + wv.startDate + '</span>'
      + '<span class="chip">' + wv.items.length + '건 병렬</span></div>'
      + '<div class="grid cols-3">' + cards + '</div>';
  }
  var remaining = waves.reduce(function (n, w) { return n + w.items.length; }, 0);
  var waveTile = '<div class="tile"><div class="inner"><h2>Wave별 착수 계획<span class="sub">잔여 ' + remaining + '건</span></h2>'
    + (waves.length ? waves.map(waveSection).join('') : '<p class="lead">잔여 작업이 없습니다.</p>') + '</div></div>';

  document.getElementById('main').innerHTML = intro + ganttTile + waveTile;
  U.diagram(document.getElementById('gantt'), { title: '병렬 Wave 일정표(Gantt)', code: ganttCode, legend: U.workLegend() });
})();
</script>
</body>
</html>
